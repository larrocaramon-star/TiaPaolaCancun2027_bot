name: Daily Car Offer (CUN)
on:
  schedule:
    - cron: '0 12 * * *'   # se ejecuta cada día a las 12:00 UTC (ajusta si quieres otra hora)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install requests
      - name: Run scraper validator and notify
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Cambia estas fechas por las que quieras cotizar (siempre dentro 2026-02-03 a 2026-02-15)
          RENT_START: "2026-02-03"
          RENT_END: "2026-02-15"
        run: |   python scrape_and_notify.py
