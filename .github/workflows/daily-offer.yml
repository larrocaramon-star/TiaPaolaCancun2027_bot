name: Daily Car Offer (CUN)
on:
  schedule:
    - cron: '0 12 * * *' # se ejecuta cada día a las 12:00 UTC
  workflow_dispatch:
    inputs:
      rent_start:
        description: 'Fecha inicio YYYY-MM-DD'
        required: true
        default: '2026-02-03'
      rent_end:
        description: 'Fecha fin YYYY-MM-DD'
        required: true
        default: '2026-02-15'

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
  run: |
    python -m pip install --upgrade pip
    python -m pip install -r requirements.txt
